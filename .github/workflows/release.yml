name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    env:
      PROJECT: DocuHelperEditor/DocuHelperEditor.csproj
      TFM: net10.0-windows10.0.19041.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install workloads
        run: dotnet workload restore ${{ env.PROJECT }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -f ${{ env.TFM }}
          -c Release
          -p:RuntimeIdentifierOverride=win-x64
          -p:SelfContained=true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.value }}
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases

      - name: Extract release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $notes = @()
          $found = $false
          if (Test-Path RELEASE_NOTES.md) {
            $inside = $false
            foreach ($line in Get-Content RELEASE_NOTES.md -Encoding utf8) {
              if ($line -match '^## (.+)$') {
                $title = $matches[1].Trim().TrimStart('v')
                $inside = $title -eq $version
                $found = $found -or $inside
                continue
              }
              if ($inside) { $notes += $line }
            }
          }
          if (-not $found) {
            Write-Warning "RELEASE_NOTES.md에 $version 항목이 없어요. 업데이트 창에 바뀐 점이 나오지 않아요."
          }
          $notes -join "`n" | Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8

      - name: Pack
        run: >
          vpk pack
          --packId DocuHelper
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe DocuHelperEditor.exe
          --packTitle "문서 도우미"
          --icon DocuHelperEditor/Platforms/Windows/appicon.ico
          --framework webview2
          --releaseNotes ${{ runner.temp }}/release-notes.md
          --delta none
          -o Releases

      - name: Upload release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "문서 도우미 ${{ steps.version.outputs.value }}"
          --tag ${{ github.ref_name }}
          -o Releases
